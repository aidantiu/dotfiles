# Ubuntu's AppIndicator extension scans the bus ("brute-force mode") when its
# StatusNotifierWatcher starts. If Vicinae's tray icon already exists at that
# moment it gets added once by the scan and once by Vicinae's own registration,
# so the top bar shows two icons. Start Vicinae only after the watcher is up
# and its scan has finished.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 100); do gdbus introspect --session --dest org.kde.StatusNotifierWatcher --object-path /StatusNotifierWatcher >/dev/null 2>&1 && exec sleep 3; sleep 0.2; done'
