-- Nightswim desktop widgets. Drawing lives in widgets.lua (same directory).
-- Started by ~/.config/autostart/nightswim-widgets.desktop (see desktop.sh).
local here = debug.getinfo(1, 'S').source:match('^@(.*/)') or './'
conky.config = {
  lua_load = here .. 'widgets.lua',
  lua_draw_hook_pre = 'nightswim',

  output_backend = 'x11',
  own_window = true,
  own_window_class = 'Conky',   -- Forge's default overrides float this class
  own_window_type = 'desktop',
  own_window_color = '#00000000',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  double_buffer = true,

  alignment = 'top_right',
  gap_x = 14,
  gap_y = 44,
  minimum_width = 812, maximum_width = 812,
  minimum_height = 412,

  update_interval = 2,
  cpu_avg_samples = 2,
  background = false,
  draw_shades = false,
  draw_outline = false,
  draw_borders = false,
  use_xft = true,
}

conky.text = [[]]

-- Per-machine overrides: hosts/<hostname>/conky.lua may edit conky.config.
local hf = io.open('/etc/hostname')
local host = hf and hf:read('*l') or ''
if hf then hf:close() end
local override = here .. '../../hosts/' .. host .. '/conky.lua'
local of = io.open(override)
if of then of:close(); dofile(override) end
