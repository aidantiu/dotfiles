# Nightswim tmux theme — palette in ~/dotfiles/nightswim/palette.sh
# Pills use Nerd Font round caps (U+E0B6 / U+E0B4).

set -g status-style "bg=default,fg=#bdb3d6"
# Reset catppuccin leftovers: a reload doesn't clear options the old theme set, and
# their #1e1e2e paints grey boxes behind the bar and the inactive window names.
set -g status-bg default
set -g window-status-style default
set -g window-status-activity-style reverse
set -g status-justify absolute-centre   # window list centred on the screen, regardless of left/right widths
set -g status-left-length 40
set -g status-right-length 80
set -g window-status-separator " "

# Session pill doubles as a mode indicator: pink while the prefix is pending,
# cyan in copy mode, lilac otherwise. The icon swaps too, so it isn't colour-only.
set -g @ns_pill "#{?client_prefix,#d79bc9,#{?pane_in_mode,#8cc4d4,#9a8cc8}}"
set -g @ns_pill_icon "#{?client_prefix,󰌌,#{?pane_in_mode,󰆏,}}"
set -g status-left "#[fg=#{E:@ns_pill},bg=default]#[fg=#0e1328,bg=#{E:@ns_pill},bold]#{E:@ns_pill_icon} #S #[fg=#{E:@ns_pill},bg=default,nobold] "
set -g window-status-format "#[fg=#6b6f9a] #I #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format "#[fg=#e8a95b,bg=default]#[fg=#0e1328,bg=#e8a95b,bold]#I #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, 󰊓,}#[fg=#e8a95b,bg=default,nobold]"
set -g status-right "#[fg=#2a2f55,bg=default]#[fg=#d6cfe8,bg=#2a2f55] #{b:pane_current_path} #[fg=#2a2f55,bg=default] #[fg=#2a2f55,bg=default]#[fg=#e8a95b,bg=#2a2f55] %H:%M #[fg=#2a2f55,bg=default]"

set -g message-style "fg=#e8a95b,bg=#2a2f55"
set -g message-command-style "fg=#d79bc9,bg=#2a2f55"
set -g mode-style "fg=#0e1328,bg=#e8a95b"
set -g clock-mode-colour "#e8a95b"
set -g popup-border-style "fg=#9a8cc8"
set -g popup-border-lines rounded
set -g @floax-border-color '#9a8cc8'
set -g @floax-text-color '#d6cfe8'

# Focused pane: heavy gold frame + gold title pill; others dim (text only, so the
# transparent background is kept). tmux can't draw the screen's outer edge, so the
# title strip on top closes the frame. The strip only shows when a window is split.
set -g pane-border-lines heavy
set -g pane-border-style "fg=#2a2f55,bg=default"
set -g pane-active-border-style "fg=#e8a95b,bg=default"
set -g pane-border-indicators off
set -g window-style "fg=#6b6f9a"
set -g window-active-style "fg=#d6cfe8"
set -g pane-border-format "#{?pane_active,#[fg=#e8a95b]#[fg=#0e1328#,bg=#e8a95b#,bold] #P #{pane_current_command} #[fg=#e8a95b#,bg=default#,nobold],#[fg=#6b6f9a] #P #{pane_current_command} }"
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'

# workmux dashboard (prefix+w replaces tmux's choose-tree on w)
bind w display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "workmux dashboard"
# prefix+W: a standing dashboard in a "wm" window — switch to it if this session has one, else open it.
bind W if-shell 'tmux select-window -t "#{session_name}:=wm"' '' 'new-window -n wm -c "#{pane_current_path}" "workmux dashboard"'
