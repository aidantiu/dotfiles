# workmux config — GENERATED by ~/dotfiles/bin/wm-agents from workmux/config.template.yaml.
# Edit the template, then run `wm-agents`.
nerdfont: true
status_format: false   # Nightswim tmux pills render #{@workmux_status} themselves
# Single-width Nerd Font glyphs: the default emoji icons have no glyph in the
# terminal font and render as a blank double-width gap inside the window pills.
status_icons:
  working: "󰔟"   # nf-md-timer_sand
  waiting: "󰍡"   # nf-md-message
  done: "󰄬"      # nf-md-check
agent: @@AGENT@@
agents:
@@AGENTS@@
panes:
  - command: <agent>
    focus: true
layouts:
  solo:
    panes:
      - command: <agent>
        focus: true
  with-dev:
    panes:
      - command: <agent>
        focus: true
      - command: npm run dev
        split: horizontal
      - command: git log --oneline --graph --decorate
        split: vertical
files:
  copy:
    - .env
    - .env.local
